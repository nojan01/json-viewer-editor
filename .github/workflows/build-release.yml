name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install dependencies
        working-directory: tauri-app
        run: npm install
        
      - name: Build Tauri App
        working-directory: tauri-app
        run: npm run build
        
      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: tauri-app/src-tauri/target/release/bundle/msi/*.msi
          
      - name: Upload Windows NSIS Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: tauri-app/src-tauri/target/release/bundle/nsis/*.exe

  build-windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Rust with ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
        
      - name: Install dependencies
        working-directory: tauri-app
        run: npm install
        
      - name: Build Tauri App for ARM64
        working-directory: tauri-app
        run: npx tauri build --target aarch64-pc-windows-msvc
        
      - name: Upload Windows ARM64 Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-installer
          path: tauri-app/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi
          
      - name: Upload Windows ARM64 NSIS Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-nsis-installer
          path: tauri-app/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
        
      - name: Install dependencies
        working-directory: tauri-app
        run: npm install
        
      - name: Build Tauri App
        working-directory: tauri-app
        run: npm run build
        
      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: tauri-app/src-tauri/target/release/bundle/deb/*.deb
          
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: tauri-app/src-tauri/target/release/bundle/appimage/*.AppImage
          
      - name: Upload Linux RPM
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: tauri-app/src-tauri/target/release/bundle/rpm/*.rpm

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install dependencies
        working-directory: tauri-app
        run: npm install
        
      - name: Build Tauri App
        working-directory: tauri-app
        run: npm run build
        
      - name: Re-sign app with proper ad-hoc signature
        run: |
          APP_PATH="tauri-app/src-tauri/target/release/bundle/macos/JSON Viewer.app"
          echo "Re-signing app..."
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          echo "Signature OK"
          
      - name: Rebuild DMG with signed app and Applications symlink
        run: |
          set -e
          VERSION=$(python3 -c "import json; print(json.load(open('tauri-app/src-tauri/tauri.conf.json'))['version'])")
          DMG_DIR="tauri-app/src-tauri/target/release/bundle/dmg"
          APP_SRC="tauri-app/src-tauri/target/release/bundle/macos/JSON Viewer.app"
          DMG_PATH="$DMG_DIR/JSON Viewer_${VERSION}_aarch64.dmg"
          STAGING="/tmp/dmg-staging"
          
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "$APP_SRC" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          
          rm -f "$DMG_PATH"
          mkdir -p "$DMG_DIR"
          hdiutil create -volname "JSON Viewer" -srcfolder "$STAGING" -ov -format UDZO "$DMG_PATH"
          rm -rf "$STAGING"
          ls -la "$DMG_PATH"
        
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: tauri-app/src-tauri/target/release/bundle/dmg/*.dmg

  release:
    needs: [build-windows, build-windows-arm64, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
        
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        
      - name: List downloaded files
        run: find . -type f -name "*.msi" -o -name "*.exe" -o -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm"
        
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', steps.date.outputs.date) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Build {0}', steps.date.outputs.date) }}
          files: |
            windows-installer/*.msi
            windows-nsis-installer/*.exe
            windows-arm64-installer/*.msi
            windows-arm64-nsis-installer/*.exe
            linux-deb/*.deb
            linux-appimage/*.AppImage
            linux-rpm/*.rpm
            macos-dmg/*.dmg
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.ref_type != 'tag' }}
