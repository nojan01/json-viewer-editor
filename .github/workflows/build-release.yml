name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to update
        required: true
        default: v1.3.7
        type: string
      build_macos:
        description: Build macOS with the configured Apple signing secrets
        required: true
        default: false
        type: boolean

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install dependencies
        working-directory: tauri-app
        run: npm install
        
      - name: Build Tauri App
        working-directory: tauri-app
        run: npm run build
        
      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: tauri-app/src-tauri/target/release/bundle/msi/*.msi
          
      - name: Upload Windows NSIS Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: tauri-app/src-tauri/target/release/bundle/nsis/*.exe

  build-windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Rust with ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
        
      - name: Install dependencies
        working-directory: tauri-app
        run: npm install
        
      - name: Build Tauri App for ARM64
        working-directory: tauri-app
        run: npx tauri build --target aarch64-pc-windows-msvc
        
      - name: Upload Windows ARM64 Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-installer
          path: tauri-app/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi
          
      - name: Upload Windows ARM64 NSIS Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-nsis-installer
          path: tauri-app/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
        
      - name: Install dependencies
        working-directory: tauri-app
        run: npm install
        
      - name: Build Tauri App
        working-directory: tauri-app
        run: npm run build
        
      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: tauri-app/src-tauri/target/release/bundle/deb/*.deb
          
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: tauri-app/src-tauri/target/release/bundle/appimage/*.AppImage
          
      - name: Upload Linux RPM
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: tauri-app/src-tauri/target/release/bundle/rpm/*.rpm

  build-macos:
    if: ${{ inputs.build_macos }}
    runs-on: macos-latest
    env:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install dependencies
        working-directory: tauri-app
        run: npm install

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE:?APPLE_CERTIFICATE is not configured}"
          : "${APPLE_CERTIFICATE_PASSWORD:?APPLE_CERTIFICATE_PASSWORD is not configured}"
          : "${KEYCHAIN_PASSWORD:?KEYCHAIN_PASSWORD is not configured}"

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          test -n "$SIGNING_IDENTITY" || { echo "No valid Developer ID Application identity found" >&2; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Prepare Apple notarization credentials
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          : "${APPLE_API_ISSUER:?APPLE_API_ISSUER is not configured}"
          : "${APPLE_API_KEY:?APPLE_API_KEY is not configured}"
          : "${APPLE_API_KEY_P8:?APPLE_API_KEY_P8 is not configured}"

          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
        
      - name: Build, sign and notarize Tauri app
        working-directory: tauri-app
        run: npm run build

      - name: Verify signed and notarized macOS release
        working-directory: tauri-app
        run: |
          set -euo pipefail
          APP_PATH="src-tauri/target/release/bundle/macos/JSON Viewer.app"
          DMG_PATH=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)

          test -d "$APP_PATH"
          test -n "$DMG_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -F "Authority=Developer ID Application:"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --verbose=4 --type execute "$APP_PATH"
          spctl --assess --verbose=4 --type open --context context:primary-signature "$DMG_PATH"
        
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: tauri-app/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true

  release:
    needs: [build-windows, build-windows-arm64, build-linux, build-macos]
    if: >-
      ${{ always() &&
          needs.build-windows.result == 'success' &&
          needs.build-windows-arm64.result == 'success' &&
          needs.build-linux.result == 'success' &&
          (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        
      - name: List downloaded files
        run: find . -type f -name "*.msi" -o -name "*.exe" -o -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm"
        
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: JSON Viewer/Editor 1.3.7
          files: |
            windows-installer/*.msi
            windows-nsis-installer/*.exe
            windows-arm64-installer/*.msi
            windows-arm64-nsis-installer/*.exe
            linux-deb/*.deb
            linux-appimage/*.AppImage
            linux-rpm/*.rpm
            macos-dmg/*.dmg
          fail_on_unmatched_files: false
          generate_release_notes: false
          draft: false
          prerelease: false
