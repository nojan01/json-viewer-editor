name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install dependencies
        working-directory: tauri-app
        run: npm install
        
      - name: Build Tauri App
        working-directory: tauri-app
        run: npm run build
        
      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: tauri-app/src-tauri/target/release/bundle/msi/*.msi
          
      - name: Upload Windows NSIS Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: tauri-app/src-tauri/target/release/bundle/nsis/*.exe

  build-windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Rust with ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
        
      - name: Install dependencies
        working-directory: tauri-app
        run: npm install
        
      - name: Build Tauri App for ARM64
        working-directory: tauri-app
        run: npx tauri build --target aarch64-pc-windows-msvc
        
      - name: Upload Windows ARM64 Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-installer
          path: tauri-app/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi
          
      - name: Upload Windows ARM64 NSIS Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-nsis-installer
          path: tauri-app/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
        
      - name: Install dependencies
        working-directory: tauri-app
        run: npm install
        
      - name: Build Tauri App
        working-directory: tauri-app
        run: npm run build
        
      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: tauri-app/src-tauri/target/release/bundle/deb/*.deb
          
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: tauri-app/src-tauri/target/release/bundle/appimage/*.AppImage
          
      - name: Upload Linux RPM
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: tauri-app/src-tauri/target/release/bundle/rpm/*.rpm

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install dependencies
        working-directory: tauri-app
        run: npm install
        
      - name: Build Tauri App
        working-directory: tauri-app
        run: npm run build
        
      - name: Repackage DMG with Installer script
        working-directory: tauri-app
        run: |
          set -e
          APP_NAME="JSON Viewer"
          BUILD_DIR="src-tauri/target/release/bundle"
          STAGING="$BUILD_DIR/dmg-staging"
          
          # Read version from tauri.conf.json
          VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          DMG_NAME="${APP_NAME}_${VERSION}_aarch64.dmg"
          
          echo "Repackaging DMG v${VERSION} with installer script..."
          
          # Create staging directory
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          
          # Copy the built .app
          cp -R "$BUILD_DIR/macos/${APP_NAME}.app" "$STAGING/"
          
          # Create installer script that removes quarantine
          cat > "$STAGING/Installieren.command" << 'SCRIPT'
          #!/bin/bash
          # JSON Viewer Installer – Doppelklicken zum Installieren
          APP_NAME="JSON Viewer.app"
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          INSTALL_DIR="/Applications"
          
          clear
          echo ""
          echo "=========================================="
          echo "  JSON Viewer – Installer"
          echo "=========================================="
          echo ""
          
          if [ ! -d "$SCRIPT_DIR/$APP_NAME" ]; then
              echo "Fehler: $APP_NAME nicht gefunden."
              echo "Bitte oeffnen Sie die DMG und fuehren Sie dieses Skript von dort aus."
              read -p "Enter druecken zum Beenden..."
              exit 1
          fi
          
          echo "Installiere $APP_NAME nach $INSTALL_DIR..."
          
          # Remove old version
          if [ -d "$INSTALL_DIR/$APP_NAME" ]; then
              rm -rf "$INSTALL_DIR/$APP_NAME" 2>/dev/null || sudo rm -rf "$INSTALL_DIR/$APP_NAME"
          fi
          
          # Copy app
          cp -R "$SCRIPT_DIR/$APP_NAME" "$INSTALL_DIR/" 2>/dev/null || sudo cp -R "$SCRIPT_DIR/$APP_NAME" "$INSTALL_DIR/"
          
          # Remove quarantine attribute (fixes Gatekeeper "damaged" error)
          xattr -cr "$INSTALL_DIR/$APP_NAME" 2>/dev/null || sudo xattr -cr "$INSTALL_DIR/$APP_NAME"
          
          echo ""
          echo "Installation erfolgreich!"
          echo ""
          echo "Sie koennen JSON Viewer jetzt verwenden:"
          echo "  - Starten Sie die App aus dem Applications-Ordner"
          echo "  - Rechtsklick auf JSON-Dateien -> Oeffnen mit -> JSON Viewer"
          echo ""
          read -p "Enter druecken zum Beenden..."
          SCRIPT
          chmod +x "$STAGING/Installieren.command"
          
          # Symlink to Applications
          ln -s /Applications "$STAGING/Applications"
          
          # Create README
          cat > "$STAGING/LIESMICH.txt" << 'README'
          JSON Viewer - Installation
          
          Option 1 (Empfohlen):
            Doppelklicken Sie auf "Installieren.command"
            Dies installiert die App und konfiguriert Gatekeeper automatisch.
          
          Option 2 (Manuell):
            1. Ziehen Sie "JSON Viewer.app" in den Applications-Ordner
            2. Oeffnen Sie Terminal und fuehren Sie aus:
               xattr -cr "/Applications/JSON Viewer.app"
          README
          
          # Remove old DMG and create new one with installer
          rm -f "$BUILD_DIR/dmg/$DMG_NAME"
          mkdir -p "$BUILD_DIR/dmg"
          hdiutil create -volname "$APP_NAME" \
              -srcfolder "$STAGING" \
              -ov -format UDZO \
              "$BUILD_DIR/dmg/$DMG_NAME"
          
          # Cleanup
          rm -rf "$STAGING"
          echo "DMG created: $BUILD_DIR/dmg/$DMG_NAME"
          ls -la "$BUILD_DIR/dmg/"
        
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: tauri-app/src-tauri/target/release/bundle/dmg/*.dmg

  release:
    needs: [build-windows, build-windows-arm64, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
        
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        
      - name: List downloaded files
        run: find . -type f -name "*.msi" -o -name "*.exe" -o -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm"
        
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', steps.date.outputs.date) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Build {0}', steps.date.outputs.date) }}
          files: |
            windows-installer/*.msi
            windows-nsis-installer/*.exe
            windows-arm64-installer/*.msi
            windows-arm64-nsis-installer/*.exe
            linux-deb/*.deb
            linux-appimage/*.AppImage
            linux-rpm/*.rpm
            macos-dmg/*.dmg
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.ref_type != 'tag' }}
