name: Windows and macOS Test Build

on:
  pull_request:
    branches: [main]
    paths:
      - "tauri-app/**"
      - ".github/workflows/windows-macos-test-build.yml"

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install application dependencies
        working-directory: tauri-app
        run: npm install

      - name: Build Windows x64 packages
        working-directory: tauri-app
        run: npm run build

      - name: Upload Windows x64 test packages
        uses: actions/upload-artifact@v4
        with:
          name: json-viewer-1.3.7-windows-x64-scrollbar-test
          path: |
            tauri-app/src-tauri/target/release/bundle/msi/*.msi
            tauri-app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust with ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Install application dependencies
        working-directory: tauri-app
        run: npm install

      - name: Build Windows ARM64 packages
        working-directory: tauri-app
        run: npx tauri build --target aarch64-pc-windows-msvc

      - name: Upload Windows ARM64 test packages
        uses: actions/upload-artifact@v4
        with:
          name: json-viewer-1.3.7-windows-arm64-scrollbar-test
          path: |
            tauri-app/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi
            tauri-app/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos-arm64:
    runs-on: macos-latest
    env:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install application dependencies
        working-directory: tauri-app
        run: npm install

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE:?APPLE_CERTIFICATE is not configured}"
          : "${APPLE_CERTIFICATE_PASSWORD:?APPLE_CERTIFICATE_PASSWORD is not configured}"
          : "${KEYCHAIN_PASSWORD:?KEYCHAIN_PASSWORD is not configured}"

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          test -n "$SIGNING_IDENTITY" || { echo "No valid Developer ID Application identity found" >&2; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Prepare Apple notarization credentials
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          : "${APPLE_API_ISSUER:?APPLE_API_ISSUER is not configured}"
          : "${APPLE_API_KEY:?APPLE_API_KEY is not configured}"
          : "${APPLE_API_KEY_P8:?APPLE_API_KEY_P8 is not configured}"

          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build, sign and notarize macOS package
        working-directory: tauri-app
        run: npm run build

      - name: Verify signed and notarized macOS package
        working-directory: tauri-app
        run: |
          set -euo pipefail
          APP_PATH="src-tauri/target/release/bundle/macos/JSON Viewer.app"
          DMG_PATH=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)

          test -d "$APP_PATH"
          test -n "$DMG_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -F "Authority=Developer ID Application:"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --verbose=4 --type execute "$APP_PATH"
          spctl --assess --verbose=4 --type open --context context:primary-signature "$DMG_PATH"

      - name: Upload macOS test package
        uses: actions/upload-artifact@v4
        with:
          name: json-viewer-1.3.7-macos-arm64-signed-notarized-scrollbar-test
          path: tauri-app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
