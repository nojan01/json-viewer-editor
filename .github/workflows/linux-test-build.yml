name: Linux Test Build

on:
  pull_request:
    branches: [main]
    paths:
      - "tauri-app/**"
      - ".github/workflows/linux-test-build.yml"

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Install application dependencies
        working-directory: tauri-app
        run: npm install

      - name: Build Linux packages
        working-directory: tauri-app
        run: npm run build

      - name: Upload Linux test packages
        uses: actions/upload-artifact@v4
        with:
          name: json-viewer-1.3.7-linux-scrollbar-test
          path: |
            tauri-app/src-tauri/target/release/bundle/deb/*.deb
            tauri-app/src-tauri/target/release/bundle/appimage/*.AppImage
            tauri-app/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
